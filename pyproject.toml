[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctn-monitor"
version = "4.0.2"
description = "Compulsory COVID Testing Monitor pipeline module"
license = { text = "MIT" }
authors = [{ name = "Jack Chan" }]
requires-python = "~=3.12.0"
dependencies = [
    "fastparquet==2026.3.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pdfservices-sdk==4.0.0",
    "pyarrow==23.0.1",
    "python-dotenv==1.2.2",
    "requests==2.31.0",
]

[tool.setuptools.packages.find]
include = ["ctn_monitor*"]
